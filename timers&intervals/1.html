<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111111;
        font-family: Arial, sans-serif;
        overflow: hidden;
        color: white;
      }

      .glass-card {
        width: 148px;
        padding: 24px 15px 17px;
        background: rgba(35, 35, 35, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.025);
        border-radius: 9px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      .glass-card h2 {
        font-size: 7px;
        font-weight: 500;
        margin-bottom: 13px;
        color: #eeeeee;
      }

      .progress-container {
        width: 100%;
        height: 7px;
        background: #303030;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: #eeeeee;
        border-radius: 10px;
        transition: width 0.2s ease;
      }

      .percent {
        font-size: 7px;
        color: #cccccc;
      }

      #one {
        height: 50px;
        width: 50px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="glass-card">
      <h2>Downloading...</h2>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="percent" id="percentText">0%</div>
    </div>

    <div id="one"></div>
    <script src="4.js"></script>
  </body>
</html>
