      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 28px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      }

      input.invalid {
        border-color: #e53935;
      }

      .error {
        display: block;
        color: #e53935;
        font-size: 12px;
        margin-top: 6px;
        min-height: 14px;
      }

      .success {
        color: #218838;
        text-align: center;
        font-size: 14px;
        margin-top: 15px;
      }

      button {
        width: 100%;
        padding: 13px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #5365d8;
      }

      @media (max-width: 480px) {
        .container {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
